# mithran Platform - Complete Production Stack
# All services with proper networking, health checks, and security


services:
  cad-engine:
    build:
      context: ./cad-engine
      dockerfile: Dockerfile
    container_name: mithran-cad-engine
    environment:
      # Application
      PORT: ${CAD_ENGINE_PORT:-5055}
      NODE_ENV: ${NODE_ENV:-production}
      PYTHONUNBUFFERED: 1

      # Security
      CORS_ORIGINS: ${CAD_CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
      MAX_FILE_SIZE_MB: ${MAX_UPLOAD_MB:-50}
      RATE_LIMIT_PER_MINUTE: ${CAD_RATE_LIMIT:-10}
      # Heavy requests at once. Measured peak memory is ~16 MB of RAM per MB of STEP (a 50 MB, 150-part assembly peaks at
      # ~800 MB), so a 100 MB assembly can need ~1.6 GB alone: raise this only together with the memory limit below.
      MAX_CONCURRENT_ANALYSES: ${CAD_MAX_CONCURRENT_ANALYSES:-1}
      # A request running longer than this ends the process so the restart policy replaces it (0 = off).
      ANALYSIS_HARD_LIMIT_SECONDS: ${CAD_ANALYSIS_HARD_LIMIT_SECONDS:-900}
      # Shared secret between the backend and the engine; the engine refuses protected routes in production without it.
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?CAD_ENGINE_API_KEY is required}

      # Conversion Settings
      LINEAR_DEFLECTION: ${CAD_LINEAR_DEFLECTION:-0.1}
      ANGULAR_DEFLECTION: ${CAD_ANGULAR_DEFLECTION:-0.5}

      # Storage
      TMPDIR: /tmp/cad-files

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${CAD_ENGINE_PORT:-5055}:5055"
    volumes:
      - cad-temp:/tmp/cad-files
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5055/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Electronics design-file extraction (Gerber, drill, Pick Place)
  ecad-engine:
    build:
      context: ./ecad-engine
      dockerfile: Dockerfile
    container_name: mithran-ecad-engine
    environment:
      PORT: 5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?ECAD_ENGINE_API_KEY is required}
      ECAD_MAX_FILE_MB: ${ECAD_MAX_FILE_MB:-25}
      ECAD_RATE_LIMIT: ${ECAD_RATE_LIMIT:-30/minute}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5100/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        core: ./core
    container_name: mithran-backend
    environment:
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-4000}

      # CAD Engine
      CAD_ENGINE_URL: http://cad-engine:5055
      # Shared secret between the backend and the engine; the engine refuses protected routes in production without it.
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?CAD_ENGINE_API_KEY is required}

      # Electronics extraction engine
      ECAD_ENGINE_URL: http://ecad-engine:5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?ECAD_ENGINE_API_KEY is required}

      # Authentication
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      APP_ENV: ${APP_ENV:-local}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-7d}

      # Security
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - frontend-network
      - backend-network
    depends_on:
      cad-engine:
        condition: service_healthy
      ecad-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:4000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:4000}/v1/api
    container_name: mithran-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Server-side API calls (within Docker network)
      API_URL: http://backend:4000/v1/api
      # Client-side API calls (from browser)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  # Public-facing network (frontend <-> backend)
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Internal backend services network
  backend-network:
    driver: bridge
    internal: false # Set to true in production for isolation
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  cad-temp:
    driver: local
