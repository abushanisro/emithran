# Local development stack only: NOT for stage or production (that is docker-compose.prod.yml, with its hardening and the tunnel).
# Ports are published on 127.0.0.1 only, and the engines sit on an internal network with no route in from the host or out to
# the internet; the backend reaches them over that network.


services:
  cad-engine:
    build:
      context: ./cad-engine
      dockerfile: Dockerfile
    container_name: mithran-cad-engine
    environment:
      # Application
      PORT: ${CAD_ENGINE_PORT:-5055}
      NODE_ENV: ${NODE_ENV:-production}
      PYTHONUNBUFFERED: 1

      # Security
      CORS_ORIGINS: ${CAD_CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
      MAX_FILE_SIZE_MB: ${MAX_UPLOAD_MB:-50}
      RATE_LIMIT_PER_MINUTE: ${CAD_RATE_LIMIT:-10}
      # Heavy requests at once. Measured peak memory is ~16 MB of RAM per MB of STEP (a 50 MB, 150-part assembly peaks at
      # ~800 MB), so a 100 MB assembly can need ~1.6 GB alone: raise this only together with the memory limit below.
      MAX_CONCURRENT_ANALYSES: ${CAD_MAX_CONCURRENT_ANALYSES:-1}
      # A request running longer than this ends the process so the restart policy replaces it (0 = off).
      ANALYSIS_HARD_LIMIT_SECONDS: ${CAD_ANALYSIS_HARD_LIMIT_SECONDS:-900}
      # Shared secret between the backend and the engine; the engine refuses protected routes in production without it.
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?CAD_ENGINE_API_KEY is required}

      # Conversion Settings
      LINEAR_DEFLECTION: ${CAD_LINEAR_DEFLECTION:-0.1}
      ANGULAR_DEFLECTION: ${CAD_ANGULAR_DEFLECTION:-0.5}

      # Storage
      TMPDIR: /tmp/cad-files

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - cad-temp:/tmp/cad-files
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5055/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Electronics design-file extraction (Gerber, drill, Pick Place)
  ecad-engine:
    build:
      context: ./ecad-engine
      dockerfile: Dockerfile
    container_name: mithran-ecad-engine
    environment:
      PORT: 5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?ECAD_ENGINE_API_KEY is required}
      ECAD_MAX_FILE_MB: ${ECAD_MAX_FILE_MB:-25}
      ECAD_RATE_LIMIT: ${ECAD_RATE_LIMIT:-30/minute}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5100/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        core: ./core
    container_name: mithran-backend
    environment:
      # Application
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-4000}

      # CAD Engine
      CAD_ENGINE_URL: http://cad-engine:5055
      # Shared secret between the backend and the engine; the engine refuses protected routes in production without it.
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?CAD_ENGINE_API_KEY is required}

      # Electronics extraction engine
      ECAD_ENGINE_URL: http://ecad-engine:5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?ECAD_ENGINE_API_KEY is required}

      # Data, files and sign-in (backend/scripts/local-data.sh runs Postgres, PostgREST and the bucket; reach them from here through
      # host.docker.internal).
      POSTGREST_URL: ${POSTGREST_URL:?POSTGREST_URL is required}
      DB_JWT_SECRET: ${DB_JWT_SECRET:?DB_JWT_SECRET is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?AUTH0_DOMAIN is required}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?AUTH0_AUDIENCE is required}
      AUTH0_CLAIM_NAMESPACE: ${AUTH0_CLAIM_NAMESPACE:?AUTH0_CLAIM_NAMESPACE is required}
      AUTH0_TRUSTED_CONNECTIONS: ${AUTH0_TRUSTED_CONNECTIONS:?AUTH0_TRUSTED_CONNECTIONS is required}
      APP_ENV: ${APP_ENV:-local}
      # Client address behind the BFF, shared with the frontend service (required in production, optional here).
      BFF_FORWARD_SECRET: ${BFF_FORWARD_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      AUTH_DECISION_CACHE_SECONDS: ${AUTH_DECISION_CACHE_SECONDS:-10}
      ORG_THROTTLE_LIMIT: ${ORG_THROTTLE_LIMIT:-3000}
      ORG_THROTTLE_TTL: ${ORG_THROTTLE_TTL:-60000}
      ARCHIVE_MAX_EXPANDED_MB: ${ARCHIVE_MAX_EXPANDED_MB:-256}
      HEAVY_WORK_MAX_CONCURRENT: ${HEAVY_WORK_MAX_CONCURRENT:-2}
      HEAVY_WORK_MAX_PER_TENANT: ${HEAVY_WORK_MAX_PER_TENANT:-1}
      FX_RATE_MAX_CHANGE_PERCENT: ${FX_RATE_MAX_CHANGE_PERCENT:-10}
      # AI: unset key = AI features answer 503; AI_DISABLED=true is the kill switch; budgets are tokens per UTC day.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DISABLED: ${AI_DISABLED:-false}
      AI_USER_DAILY_TOKENS: ${AI_USER_DAILY_TOKENS:-2000000}
      AI_ORG_DAILY_TOKENS: ${AI_ORG_DAILY_TOKENS:-20000000}
      AI_GLOBAL_DAILY_TOKENS: ${AI_GLOBAL_DAILY_TOKENS:-50000000}
      AI_MAX_CONCURRENT_PER_USER: ${AI_MAX_CONCURRENT_PER_USER:-2}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-7d}

      # Security
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - frontend-network
      - backend-network
    depends_on:
      cad-engine:
        condition: service_healthy
      ecad-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:4000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:4000}/api/v1
    container_name: mithran-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Server-side API calls (within Docker network)
      API_URL: http://backend:4000/api/v1
      # Client-side API calls (from browser)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:4000}
      # Auth0 sign-in runs on this server; APP_BASE_URL is also the origin the BFF accepts.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?AUTH0_DOMAIN is required}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?AUTH0_AUDIENCE is required}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?AUTH0_CLIENT_ID is required}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?AUTH0_CLIENT_SECRET is required}
      AUTH0_SECRET: ${AUTH0_SECRET:?AUTH0_SECRET is required}
      TRUSTED_STORAGE_HOSTS: ${TRUSTED_STORAGE_HOSTS:-}
      # Signs the client address the BFF forwards to the backend; the same value as the backend's.
      BFF_FORWARD_SECRET: ${BFF_FORWARD_SECRET:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  # Public-facing network (frontend <-> backend)
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Engines network (backend <-> cad-engine, ecad-engine)
  backend-network:
    driver: bridge
    # No route out, none in: the engines are reachable only from the backend (which also sits on frontend-network for egress).
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  cad-temp:
    driver: local
