modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: []   # any 2xx
      preferred_ip_protocol: ip4
  # /api/health/ready answers {"status":..,"info":{"database":{"status":"up"},..},"error":{..},"details":{..}}; a down database
  # appears under "error" with status "down". Match the up entry, not the HTTP status (an engine outage also returns 503).
  database_up:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200, 503]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"info":\{[^}]*"database":\{"status":"up"'
