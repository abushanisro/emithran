name: Uptime

# An outside check that the public site works, every 5 minutes, from GitHub's own runners (not from the servers it checks, so it still reports when both
# Oracle servers are down). A failing run IS the alarm: GitHub emails the person who last changed the schedule line (Settings > Notifications > Actions:
# "Failed workflows only", on by default). Scheduled runs can start a few minutes late. It runs next to the UptimeRobot monitor: two independent watchers.
# No account, no secret, no cost (public repository). It only reads two public addresses.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: The public site answers
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe the public addresses
        env:
          SITE: https://app.emithran.com
        run: |
          fail=0
          probe() { # <url> <wanted status> [also acceptable status]
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors "$1" || true)"
            code="${code:-000}"
            echo "$1 -> $code (want $2${3:+ or $3})"
            if [ "$code" != "$2" ] && [ "$code" != "${3:-none}" ]; then fail=1; fi
          }
          # the API process, the database and both CAD engines answer (only 200 is accepted: a missing address must fail, never pass silently)
          probe "$SITE/api/health/ready" 200
          # the sign-in redirect works (the frontend and the login hand-off)
          probe "$SITE/auth/login" 307
          exit "$fail"
