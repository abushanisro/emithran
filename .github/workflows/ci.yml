name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the default token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - # The costing reference data (machine and labour rates, material prices) is proprietary, so it lives in a
        # private repository and is checked out into memory/ here; the tests compare the engines against it.
        name: Reference data (private)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abushanisro/emithran-reference-data
          ssh-key: ${{ secrets.REFERENCE_DATA_DEPLOY_KEY }}
          path: reference-data
          persist-credentials: false
      - name: Link the reference data to memory/
        working-directory: .
        run: ln -s reference-data/memory memory
      
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: No database clients in frontend code
        run: npm run check:boundary

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          # This build only proves the app compiles; it is never deployed. Production builds refuse to start without these URLs
          # (no localhost fallback), so a missing secret gets a reserved, unresolvable placeholder here (.invalid, RFC 2606).
          NEXT_PUBLIC_API_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_API_GATEWAY_URL || 'https://api.build-check.invalid' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.build-check.invalid/api/v1' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_VERSION: ${{ secrets.NEXT_PUBLIC_APP_VERSION }}
          NEXT_PUBLIC_CAD_ENGINE_URL: ${{ secrets.NEXT_PUBLIC_CAD_ENGINE_URL || 'https://cad.build-check.invalid' }}
          NEXT_PUBLIC_DEBUG_MODE: ${{ secrets.NEXT_PUBLIC_DEBUG_MODE }}
          NEXT_PUBLIC_ENABLE_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS }}
          NEXT_PUBLIC_ENABLE_DEVTOOLS: ${{ secrets.NEXT_PUBLIC_ENABLE_DEVTOOLS }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          CAD_ENGINE_URL: ${{ secrets.CAD_ENGINE_URL || 'https://cad.build-check.invalid' }}
          API_URL: ${{ secrets.API_URL || 'https://api.build-check.invalid/api/v1' }}
          # No server API keys (Anthropic, Gemini, CAD engine): Next reads them at request time only, and this step runs every
          # dependency's build script on pull requests. test/deploy/ci-workflow.test.ts keeps them out.

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - # The costing reference data (machine and labour rates, material prices) is proprietary, so it lives in a
        # private repository and is checked out into memory/ here; the tests compare the engines against it.
        name: Reference data (private)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abushanisro/emithran-reference-data
          ssh-key: ${{ secrets.REFERENCE_DATA_DEPLOY_KEY }}
          path: reference-data
          persist-credentials: false
      - name: Link the reference data to memory/
        working-directory: .
        run: ln -s reference-data/memory memory
      
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # openapi/openapi.json is generated from the controllers (no database, no secrets); fails with the command to regenerate it.
      - name: OpenAPI specification is up to date
        run: npm run openapi:check

      - name: RLS boundary and secret check
        run: npm run check:rls

      - name: Electronics domain import boundary
        run: npm run lint:electronics-boundary

      - name: Electronics memory data format
        run: npm run check:electronics-memory

      - name: Unit and domain tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build

  ecad-engine-contract:
    name: Electronics extraction engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r ecad-engine/requirements.txt -r ecad-engine/requirements-dev.txt

      - name: Contract and service tests
        working-directory: ecad-engine
        run: python -I -m pytest -q

      - name: Build the service image
        run: docker build -t ecad-engine:ci ecad-engine

  sql:
    name: Database migrations (SQL tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A migration the base branch already has is never edited (the runner refuses a changed file, which stops every newer migration): a change is a new migration.
      - name: Applied migrations are not edited
        if: github.event_name == 'pull_request'
        run: bash backend/scripts/check-migrations-immutable.sh "${{ github.base_ref }}"
      # Applies the migrations under test to a throwaway Postgres (pinned by digest) and runs their assertions.
      - run: bash backend/test/sql/run.sh

  core:
    name: Assembly core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships a stable Rust toolchain; the lock file and exact-pinned versions make the build reproducible.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The Rust nester must answer like the Python/shapely nester it replaces, placement for placement (its result feeds material cost).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install 'shapely>=2.0,<3.0'
      - run: cargo build --release --locked -p nesting
      - run: python crates/nesting/tests/differential.py 300 11
      - run: python crates/nesting/tests/differential.py heavy

  core-image:
    name: Assembly core image (runner + worker, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the worker image (the C++ worker, whose hand-worked checks run in the build, and cad-worker-host) and the runner image,
      # then runs them in two containers isolated as in docker-compose.prod.yml on a real zip of the STEP fixtures, against a stand-in
      # for the PostgREST and S3 endpoints. Also checks the isolation: no credential and no network in the worker container, no
      # credential in the runner's process environment, only the cad_runner database role used, no process outliving its job.
      - run: docker build --platform linux/amd64 --build-context geometry=geometry-worker --build-context fixtures=backend/test/fixtures/cad --target worker -t cad-worker:dev core
      - run: docker build --platform linux/amd64 -t cad-core:dev core
      - run: python3 core/tests/e2e.py

  postgres-compat:
    name: Plain Postgres + PostgREST (Supabase-free data layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: backend
      # Migration 930 on a bare Postgres, then a real PostgREST: tokens the backend mints must drive unchanged RLS policies.
      - run: npm run test:postgrest
        working-directory: backend

  object-store:
    name: S3-compatible object store (real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: backend
      # The real S3ObjectStore against a real S3-compatible server: binary safety, no-overwrite, isolation, listing, signed URLs.
      - run: npm run test:s3
        working-directory: backend
      # The built app starts with no Supabase settings at all (Auth0 + PostgREST + S3) and refuses unauthenticated requests.
      - run: npx nest build && npm run test:boot
        working-directory: backend

  local-data:
    name: Local development stack without Supabase (Postgres, data API, files, backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: backend
      # Baseline -> local Postgres -> newer migrations -> data API + bucket -> the real built backend running with no Supabase setting at all.
      - run: npm run test:local
        working-directory: backend

  geometry-worker:
    name: Geometry worker (C++ build, hand-worked checks, parity with the Python engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build runs the hand-worked checks (tests/unit_tests.cpp) and fails if the image would not read STEP correctly.
      - run: docker build --platform linux/amd64 --build-context fixtures=backend/test/fixtures/cad -t gw-build:dev geometry-worker
      - run: docker build --platform linux/amd64 -t py-occt:dev -f geometry-worker/tests/Dockerfile.pyocct geometry-worker/tests
      # Same fixtures through the Python engine and the C++ worker; the two reports must agree.
      - run: python3 geometry-worker/tests/parity.py
      # The comparison the real-file parity harness (tests/real/run.py, run by hand with real zips) classifies differences with.
      - run: python3 -m unittest -q test_compare
        working-directory: geometry-worker/tests/real

  casting-worker:
    name: Casting worker (C++ build, sandboxed run, hand-worked results)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The worker's sources must still be what PROVENANCE.sha256 records (Dockerfile is the one file not covered).
      - run: grep -v ' \./Dockerfile$' PROVENANCE.sha256 | shasum -a 256 -c -
        working-directory: casting-worker
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: backend
      # Builds OCCT from source (slow), runs the unit tests and the samples in the production sandbox, compares results.
      - run: casting-worker/check.sh
      # The worker host (core's cad-worker-host + this worker, target `host`) in its sandbox, a real STEP part through the backend's own client over the socket.
      - run: casting-worker/e2e.sh
      # The accuracy gate's tooling on the hand-worked synthetic samples (every label derived from the geometry, not from the worker). It can never claim S3: only real parts can.
      - run: casting-worker/accuracy.sh --synthetic

  cad-engine:
    name: CAD Engine (Docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cad-engine
          push: false
          tags: cad-engine:ci

  backend-image:
    name: Backend image (no source maps shipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The delivered image must not carry our source maps or TypeScript (on-premises edition, step 1).
      - run: docker build --build-context core=core -t backend:ci backend
      - run: scripts/check-image-no-sourcemaps.sh backend:ci
