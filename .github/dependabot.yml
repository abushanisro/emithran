# Keeps every pin current. Digest-pinned images, SHA-pinned actions and lock files only stay safe if something proposes the
# bumps; without this they quietly age. Updates arrive as pull requests, so CI (ci.yml and security.yml) vets each one. They open against
# `develop` like every other change (docs/BRANCHING.md) and reach `main` with the next release.
version: 2
updates:
  - package-ecosystem: npm
    target-branch: develop
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    target-branch: develop
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # The @nestjs packages move together with @nestjs/core: @nestjs/swagger 12 needs Nest 12 (and is ESM-only), and merged against Nest 11 it
    # broke every backend spec on main. A new major is a deliberate migration of all of them at once, not a single bump.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # @types/node describes one Node major: it follows the runtime (.nvmrc, Node 24), not the newest release. @types/node 26 on Node 24
      # type-checks APIs Node 24 does not have, and it dropped the Array.at declaration the backend's lib setting had leaned on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESM-only from these majors (uuid 12+, snake-case/camel-case 4+/5+ of change-case 5); the backend compiles to CommonJS and Jest
      # cannot load them ("Must use import to load ES Module"). Moving the backend to ESM is the deliberate step that lifts this.
      - dependency-name: "uuid"
        update-types: ["version-update:semver-major"]
      - dependency-name: "snake-case"
        update-types: ["version-update:semver-major"]
      - dependency-name: "camel-case"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # Base images pinned by digest in the Dockerfiles
  - package-ecosystem: docker
    target-branch: develop
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    target-branch: develop
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    target-branch: develop
    directory: /cad-engine
    schedule: { interval: weekly }
  - package-ecosystem: docker
    target-branch: develop
    directory: /ecad-engine
    schedule: { interval: weekly }

  # The cloudflared image pinned in docker-compose.prod.yml
  - package-ecosystem: docker-compose
    target-branch: develop
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: pip
    target-branch: develop
    directory: /cad-engine
    schedule: { interval: weekly }
  - package-ecosystem: pip
    target-branch: develop
    directory: /ecad-engine
    schedule: { interval: weekly }
