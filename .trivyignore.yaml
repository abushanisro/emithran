  - id: CVE-2026-116587
    paths:
      - "usr/local/bin/cloudflared"
    statement: >-
      go-jose in the cloudflared binary (cloudflare/cloudflared 2026.10.5). Vendor binary: there is no fixed release yet. The
      tunnel only dials out with a token and parses no untrusted JOSE input from visitors. Re-check when cloudflared ships a
      build with go-jose >= 4.1.6 (Dependabot will propose it).
    expired_at: 2026-12-15
  - id: CVE-2026-78661
    paths:
      - "usr/local/bin/cloudflared"
    statement: >-
      golang.org/x/net v0.61.0 (GO-2026-6860, html parser quadratic text coalescing, DoS) in the cloudflared binary. The module is
      listed in the build info but the vulnerable package is not linked: zero golang.org/x/net/html symbols in the binary and
      govulncheck binary mode reports 0 affected vulnerabilities. No cloudflared release builds with x/net >= 0.62.0 yet (2026.10.7
      is the latest). Evidence and reproduction: docs/security-findings/CVE-2026-78661-cloudflared.md. Covers this CVE only, not
      GO-2026-6866 / CVE-2026-97045. Short expiry on purpose: re-run the evidence for any new cloudflared digest, and drop this
      entry when a release ships x/net >= 0.62.0 (Dependabot will propose it).
    expired_at: 2026-12-07
  - id: CVE-2026-115905
    paths:
      - "opt/conda/lib/python3.14/site-packages/rattler/rattler.abi3.so"
    statement: >-
      The `zip` Rust crate compiled into rattler, part of conda's own base environment (continuumio/miniconda3). conda is only
      used while the image is built; the running service executes in cad-env and never calls it, and the container has no
      internet. No fixed conda release yet. Re-check when miniconda3 ships a rattler built with zip >= 9.0.5.
    expired_at: 2026-12-15
