# Stage and production. One file, two environments; the env file decides which:
#
#   docker compose -p emithran-stage -f docker-compose.prod.yml --env-file env/stage.env up -d --build
#   docker compose -p emithran-prd   -f docker-compose.prod.yml --env-file env/prd.env   up -d --build
#
# Shape of the deployment (docs/DEPLOYMENT_SECURITY.md explains each choice):
#
#   internet -> Cloudflare (WAF, rate limiting, Access on stage) -> cloudflared tunnel -> frontend, backend
#   the host publishes NO ports: nothing can reach a container except through the tunnel
#   engines (cad, ecad) live on a private network with no internet access and are reached only by the backend/frontend
#
# Every container is read-only, runs without Linux capabilities, cannot gain privileges, and has memory/CPU/process limits
# (the process cap lives in deploy.resources.limits.pids, where Compose expects it next to the other limits).
# test/deploy/compose-hardening.test.ts fails the build if any of that is weakened.

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- Ingress: the only way in. The tunnel is outbound-only; routes are set in the Cloudflare dashboard. ---
  cloudflared:
    <<: *hardened
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN (from the Cloudflare tunnel) in the env file}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M, pids: 256 }

  frontend:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* values are compiled into the browser bundle at build time, so each environment builds its own image
        # from its own env file. Only public values go here: never a secret.
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:?set NEXT_PUBLIC_API_GATEWAY_URL (the public URL, which also serves /v1/*) in the env file}
        # What the browser's HTTP client calls. Without this build arg the bundle falls back to http://localhost:4000/api/v1.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_GATEWAY_URL}/api/v1
        # The one upload limit, shown in the upload card. The backend and the engine take the same MAX_UPLOAD_MB.
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
        # The Auth0 company SSO connection behind the "Sign in with SSO" button (it must be enabled for this app in Auth0). Blank: no button.
        NEXT_PUBLIC_AUTH0_SSO_CONNECTION: ${NEXT_PUBLIC_AUTH0_SSO_CONNECTION:-}
    environment:
      NODE_ENV: production
      # Server-side calls stay on the private network: the backend, and the engine through the /api/cad proxy.
      API_URL: http://backend:4000/api/v1
      CAD_ENGINE_URL: http://cad-engine:5055
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?set CAD_ENGINE_API_KEY in the env file}
      # Auth0 sign-in runs on this server (the browser never holds a token). APP_BASE_URL is also the origin the BFF accepts.
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL (the public app URL) in the env file}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in the env file}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in the env file}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?set AUTH0_CLIENT_ID in the env file}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?set AUTH0_CLIENT_SECRET in the env file}
      AUTH0_SECRET: ${AUTH0_SECRET:?set AUTH0_SECRET in the env file}
      # Hosts of the file bucket that the file proxy and the browser's 3D viewer may fetch signed links from.
      TRUSTED_STORAGE_HOSTS: ${TRUSTED_STORAGE_HOSTS:?set TRUSTED_STORAGE_HOSTS (the bucket's download host) in the env file}
      # Signs the client address the BFF forwards to the backend (lib/server/bff/forward.ts); the same value as the backend's.
      BFF_FORWARD_SECRET: ${BFF_FORWARD_SECRET:?set BFF_FORWARD_SECRET (32+ random characters, shared with the backend) in the env file}
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [edge, internal]
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G, pids: 512 }

  backend:
    <<: *hardened
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        core: ./core
    environment:
      NODE_ENV: production
      PORT: 4000
      # Which deployment this is (stage or prd); the backend refuses to boot in production without it.
      APP_ENV: ${APP_ENV:?set APP_ENV to stage or prd in the env file}
      # Sign-in: the backend verifies Auth0 access tokens itself (docs/CUTOVER_AUTH0_POSTGRES.md).
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in the env file}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in the env file}
      AUTH0_CLAIM_NAMESPACE: ${AUTH0_CLAIM_NAMESPACE:?set AUTH0_CLAIM_NAMESPACE in the env file}
      AUTH0_TRUSTED_CONNECTIONS: ${AUTH0_TRUSTED_CONNECTIONS:?set AUTH0_TRUSTED_CONNECTIONS in the env file}
      # The browser's origin; production validation rejects localhost and *.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN (the public frontend URL) in the env file}
      # The only way to reach this container is the Cloudflare tunnel, so for direct /v1/* calls the client address comes from
      # CF-Connecting-IP. Browser calls arrive from the frontend's BFF, which forwards the address signed with BFF_FORWARD_SECRET.
      TRUST_CLOUDFLARE_HEADERS: "true"
      BFF_FORWARD_SECRET: ${BFF_FORWARD_SECRET:?set BFF_FORWARD_SECRET (32+ random characters, shared with the frontend) in the env file}
      # Nothing in front of this container sets X-Forwarded-For that the API relies on: no proxy hops are trusted (never "true").
      TRUST_PROXY: "0"
      # V8 heap of the API thread: ~70% of the 2G limit below, so V8 fails with a catchable error before the kernel kills the
      # container. Heavy-work workers (HEAVY_WORK_MAX_CONCURRENT x HEAVY_WORK_WORKER_HEAP_MB, default 2 x 256 MB) have their own heaps
      # inside the same limit: raise those only together with the memory limit (backend/src/common/resource-limits.ts).
      NODE_OPTIONS: --max-old-space-size=1434
      # The largest upload accepted (frontend and engine follow).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # The 30-minute inactivity sign-out: on unless the env file says false (false keeps people signed in until Auth0's own session ends).
      SESSION_IDLE_TIMEOUT_ENABLED: ${SESSION_IDLE_TIMEOUT_ENABLED:-true}
      # How long one "is this person still authorised" answer is reused: bounds how long a removed user keeps access (0 = every request).
      AUTH_DECISION_CACHE_SECONDS: ${AUTH_DECISION_CACHE_SECONDS:-10}
      # Requests one organization may make per ORG_THROTTLE_TTL ms, across all its users and routes.
      ORG_THROTTLE_LIMIT: ${ORG_THROTTLE_LIMIT:-3000}
      ORG_THROTTLE_TTL: ${ORG_THROTTLE_TTL:-60000}
      # Parse limits (backend/src/common/resource-limits.ts): what a CAD or electronics .zip may expand to, and how many workbook/archive
      # parses run at once per process and per organization. Raise only together with the memory limit below.
      ARCHIVE_MAX_EXPANDED_MB: ${ARCHIVE_MAX_EXPANDED_MB:-256}
      HEAVY_WORK_MAX_CONCURRENT: ${HEAVY_WORK_MAX_CONCURRENT:-2}
      HEAVY_WORK_MAX_PER_TENANT: ${HEAVY_WORK_MAX_PER_TENANT:-1}
      # A budget FX rate change beyond this % of the current rate needs the admin's explicit confirmation.
      FX_RATE_MAX_CHANGE_PERCENT: ${FX_RATE_MAX_CHANGE_PERCENT:-10}
      # AI (the only place the model key lives; unset = AI features answer 503). AI_DISABLED=true refuses every AI call; the daily
      # token budgets are per UTC day (backend/src/common/ai/ai-budget.service.ts).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DISABLED: ${AI_DISABLED:-false}
      AI_USER_DAILY_TOKENS: ${AI_USER_DAILY_TOKENS:-2000000}
      AI_ORG_DAILY_TOKENS: ${AI_ORG_DAILY_TOKENS:-20000000}
      AI_GLOBAL_DAILY_TOKENS: ${AI_GLOBAL_DAILY_TOKENS:-50000000}
      AI_MAX_CONCURRENT_PER_USER: ${AI_MAX_CONCURRENT_PER_USER:-2}
      # python: this backend analyses uploads with the Python cad-engine. rust: the cad-core service does, and this backend only creates the BOM items.
      CAD_CORE: ${CAD_CORE:-python}
      # Empty: casting analyses stay queued. /run/casting-worker/worker.sock with the sand-casting profile running (casting-worker service below).
      CASTING_WORKER_SOCKET: ${CASTING_WORKER_SOCKET:-}
      CASTING_RETENTION_DAYS: ${CASTING_RETENTION_DAYS:-}
      # python: cad-engine /nest. rust: the nester binary shipped in this image (falls back to python if it is unavailable).
      NESTING_ENGINE: ${NESTING_ENGINE:-python}
      # Data: the postgrest service below, with tokens this backend signs. Files: an S3-compatible bucket.
      POSTGREST_URL: http://postgrest:3000
      DB_JWT_SECRET: ${DB_JWT_SECRET:?set DB_JWT_SECRET in the env file}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the env file}
      S3_REGION: ${S3_REGION:?set S3_REGION in the env file}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the env file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the env file}
      CAD_ENGINE_URL: http://cad-engine:5055
      # Shared secret between the backend and the engine; the engine refuses protected routes in production without it.
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?set CAD_ENGINE_API_KEY in the env file}
      ECAD_ENGINE_URL: http://ecad-engine:5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?set ECAD_ENGINE_API_KEY in the env file}
      # Telemetry is off while OTEL_EXPORTER_OTLP_ENDPOINT is empty (docs/ops/observability.md, docs/ops/monitoring.md). Metrics go to
      # Prometheus (docker-compose.monitoring.yml), e.g. http://prometheus:9090/api/v1/otlp/v1/metrics; traces to the OTLP backend
      # named by the endpoint. For metrics only, set the endpoint to http://prometheus:9090/api/v1/otlp and OTEL_TRACES_SAMPLER_ARG=0.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    # The casting worker host's group and socket, to reach it when CASTING_WORKER_SOCKET is set (docs: casting-worker/README.md).
    group_add: ["10005"]
    volumes:
      - backend-logs:/app/logs
      - casting-worker-socket:/run/casting-worker
    tmpfs:
      - /tmp
    healthcheck:
      # Liveness only: a database or engine outage must not make Docker restart a healthy process.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [edge, internal, db]
    depends_on:
      postgrest:
        condition: service_healthy
      cad-engine:
        condition: service_healthy
      ecad-engine:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G, pids: 512 }

  # --- Engines: private. They parse untrusted uploaded files, so they get no internet and no published port. ---
  cad-engine:
    <<: *hardened
    # pythonocc-core 7.8.1 is published for linux/amd64 and linux/aarch64, so this image builds natively on both (no platform pin).
    build:
      context: ./cad-engine
      dockerfile: Dockerfile
    environment:
      PORT: 5055
      NODE_ENV: production
      PYTHONUNBUFFERED: 1
      TEMP_DIR: /tmp/cad-files
      TMPDIR: /tmp/cad-files
      CORS_ORIGINS: ${CORS_ORIGIN:?set CORS_ORIGIN in the env file}
      MAX_FILE_SIZE_MB: ${MAX_UPLOAD_MB:-50}
      RATE_LIMIT_PER_MINUTE: 10
      # Heavy requests at once. Measured peak memory is ~16 MB of RAM per MB of STEP (a 50 MB, 150-part assembly peaks at
      # ~800 MB), so a 100 MB assembly can need ~1.6 GB alone: raise this only together with the memory limit below.
      MAX_CONCURRENT_ANALYSES: 1
      # A request running longer than this ends the process so the restart policy replaces it (0 = off).
      ANALYSIS_HARD_LIMIT_SECONDS: 900
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?set CAD_ENGINE_API_KEY in the env file}
      LINEAR_DEFLECTION: 0.1
      ANGULAR_DEFLECTION: 0.5
      LOG_LEVEL: info
      # Telemetry is off while OTEL_EXPORTER_OTLP_ENDPOINT is empty (docs/ops/observability.md, docs/ops/monitoring.md). Metrics go to
      # Prometheus (docker-compose.monitoring.yml), e.g. http://prometheus:9090/api/v1/otlp/v1/metrics; traces to the OTLP backend
      # named by the endpoint. For metrics only, set the endpoint to http://prometheus:9090/api/v1/otlp and OTEL_TRACES_SAMPLER_ARG=0.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    volumes:
      - cad-temp:/tmp/cad-files
      - cad-logs:/app/logs
    tmpfs:
      - /tmp
      - /home/cad:uid=10002,gid=10002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G, pids: 512 }
        reservations: { cpus: '0.5', memory: 512M }

  # --- Assembly core (docs/ASSEMBLY_CORE.md "Isolation"): two containers. cad-core (the runner) claims queued CAD uploads, holds the database
  # and bucket credentials, talks to PostgREST and the bucket over HTTP(S) only (no Postgres connection) and never parses CAD. cad-worker runs
  # the C++ geometry worker on the customer's files: no credential, no network at all, its own UID, a fresh scratch tmpfs. The two share only
  # a Unix socket on the cad-worker-socket volume. Run only when CAD_CORE=rust (`docker compose --profile rust-core up`); with CAD_CORE=python
  # the backend does it itself. ---
  cad-core:
    <<: *hardened
    profiles: [rust-core]
    build:
      context: ./core
      dockerfile: Dockerfile
      target: runner
    user: "10003:10003"
    # The worker's group, only to reach its socket (mode 0660).
    group_add: ["10005"]
    environment:
      # The same data API and bucket as the backend (the runner refuses to start, naming the missing setting, when one is empty).
      # The runner moves its three credentials out of its environment at start and signs tokens for the cad_runner role (migration 951).
      POSTGREST_URL: http://postgrest:3000
      DB_JWT_SECRET: ${DB_JWT_SECRET:?set DB_JWT_SECRET in the env file}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the env file}
      S3_REGION: ${S3_REGION:?set S3_REGION in the env file}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the env file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the env file}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # What a zip may expand to: the same setting and default as the backend, so either core accepts or refuses a zip alike.
      ARCHIVE_MAX_EXPANDED_MB: ${ARCHIVE_MAX_EXPANDED_MB:-256}
      WORKER_DEADLINE_SECONDS: 600
      WORKER_SOCKET: /run/cad-worker/worker.sock
      # What the worker may send back (result.json and the part files); held in memory until stored.
      WORKER_MAX_OUTPUT_MB: 512
    volumes:
      - cad-worker-socket:/run/cad-worker
    depends_on:
      cad-worker:
        condition: service_healthy
    healthcheck:
      # No HTTP port: the runner rewrites a heartbeat file every 10 s from its own task, and `health` checks that it is recent.
      test: ["CMD", "cad-runner", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    tmpfs:
      - /tmp:size=16m
    networks: [db]
    deploy:
      resources:
        # An upload is unzipped in memory (up to 8x MAX_UPLOAD_MB) and the worker's outputs are held until stored.
        limits: { cpus: '1', memory: 2G, pids: 128 }
        reservations: { cpus: '0.25', memory: 256M }

  # --- Casting worker host (sand casting module, backend/src/modules/sand-casting): the sand-casting geometry worker behind core's cad-worker-host,
  # sandboxed like cad-worker above, on its own socket volume. Run with `--profile sand-casting`, and set CASTING_WORKER_SOCKET=/run/casting-worker/worker.sock
  # for the backend; unset, the backend leaves casting analyses queued.
  casting-worker:
    <<: *hardened
    profiles: [sand-casting]
    build:
      context: ./casting-worker
      dockerfile: Dockerfile
      target: host
      additional_contexts:
        core: ./core
    user: "10005:10005"
    # No network at all: no interface but loopback, so a compromised worker can neither phone home nor reach PostgREST or the bucket.
    network_mode: none
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # The container limit below is 2 GB; the worker's own address-space limit stays under it.
      WORKER_MEMORY_MB: 1536
    volumes:
      - casting-worker-socket:/run/cad-worker
    healthcheck:
      test: ["CMD", "cad-worker-host", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:size=1g,uid=10005,gid=10005,mode=0700
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G, pids: 128 }
        reservations: { cpus: '0.5', memory: 256M }

  cad-worker:
    <<: *hardened
    profiles: [rust-core]
    build:
      context: ./core
      dockerfile: Dockerfile
      target: worker
      additional_contexts:
        geometry: ./geometry-worker
        fixtures: ./backend/test/fixtures/cad
    user: "10005:10005"
    # No network at all: no interface but loopback, so a compromised worker can neither phone home nor reach PostgREST or the bucket.
    network_mode: none
    # Limits only. No credential and no address belongs here (cad-worker-host refuses to start if one of the runner's is set).
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # The container limit below is 2 GB; the worker's own address-space limit stays under it (~16 MB of RAM per MB of STEP).
      WORKER_MEMORY_MB: 1536
    volumes:
      - cad-worker-socket:/run/cad-worker
    healthcheck:
      # The socket accepts a connection.
      test: ["CMD", "cad-worker-host", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      # The jobs' scratch: the host empties it and kills every leftover process after each job.
      - /tmp:size=1g,uid=10005,gid=10005,mode=0700
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G, pids: 128 }
        reservations: { cpus: '0.5', memory: 256M }

  # --- PostgREST: the data API in front of the managed Postgres (docs: docs/ENGINEERING.md "Leaving Supabase"). Reachable ONLY from
  # the backend and, with the rust-core profile, cad-core: it is on the private `db` network with them and nothing else, never
  # published, and it accepts only tokens signed with DB_JWT_SECRET (its admin server listens on loopback only). It needs outbound access to the database,
  # which is why it is not on the no-internet `internal` network. Connects as the `authenticator` role, which can only switch to
  # anon/authenticated/service_role and (migration 951) cad_runner, the runner's role. ---
  postgrest:
    <<: *hardened
    image: postgrest/postgrest@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    user: "10004:10004"
    environment:
      PGRST_DB_URI: ${POSTGREST_DB_URI:?set POSTGREST_DB_URI in the env file}
      PGRST_DB_SCHEMAS: public
      # As on Supabase: extension functions (uuid-ossp, pgcrypto) live in the `extensions` schema.
      PGRST_DB_EXTRA_SEARCH_PATH: public, extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${DB_JWT_SECRET:?set DB_JWT_SECRET in the env file}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
      # The admin server (health, metrics, config) answers only inside the container: `postgrest --ready` runs there, and no
      # db-network peer (backend, cad-core) can reach it.
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_POOL: 10
      # A transaction-mode pooler (Neon's, PgBouncer) cannot hold prepared statements; harmless with a direct connection.
      PGRST_DB_PREPARED_STATEMENTS: ${PGRST_DB_PREPARED_STATEMENTS:-false}
      PGRST_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [db]
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M, pids: 128 }

  ecad-engine:
    <<: *hardened
    build:
      context: ./ecad-engine
      dockerfile: Dockerfile
    environment:
      PORT: 5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?set ECAD_ENGINE_API_KEY in the env file}
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G, pids: 512 }

volumes:
  # The runner's and the worker's only shared object: the worker host's Unix socket.
  cad-worker-socket:
  # The same for the casting worker host (sand casting module): the backend mounts it read-only.
  casting-worker-socket:
  cad-temp:
  cad-logs:
  backend-logs:

networks:
  # PostgREST, the backend and (rust-core profile) cad-core only: PostgREST needs a route out to the database, so it cannot live on `internal`, and it must not share
  # `edge` with the tunnel and the frontend.
  db: {}
  # Has a route to the internet (the tunnel dials out; the backend calls Auth0, the bucket and the model providers).
  edge: {}
