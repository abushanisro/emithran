# Stage and production. One file, two environments; the env file decides which:
#
#   docker compose -p emithran-stage -f docker-compose.prod.yml --env-file env/stage.env up -d --build
#   docker compose -p emithran-prd   -f docker-compose.prod.yml --env-file env/prd.env   up -d --build
#
# Shape of the deployment (docs/DEPLOYMENT_SECURITY.md explains each choice):
#
#   internet -> Cloudflare (WAF, rate limiting, Access on stage) -> cloudflared tunnel -> frontend, backend
#   the host publishes NO ports: nothing can reach a container except through the tunnel
#   engines (cad, ecad) live on a private network with no internet access and are reached only by the backend/frontend
#
# Every container is read-only, runs without Linux capabilities, cannot gain privileges, and has memory/CPU/process limits
# (the process cap lives in deploy.resources.limits.pids, where Compose expects it next to the other limits).
# test/deploy/compose-hardening.test.ts fails the build if any of that is weakened.

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- Ingress: the only way in. The tunnel is outbound-only; routes are set in the Cloudflare dashboard. ---
  cloudflared:
    <<: *hardened
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN (from the Cloudflare tunnel) in the env file}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M, pids: 256 }

  frontend:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* values are compiled into the browser bundle at build time, so each environment builds its own image
        # from its own env file. Only public values go here: the publishable key is safe in a browser, the secret key never is.
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:?set NEXT_PUBLIC_API_GATEWAY_URL (the public URL, which also serves /v1/*) in the env file}
        # What the browser's HTTP client calls. Without this build arg the bundle falls back to http://localhost:4000/v1/api.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_GATEWAY_URL}/v1/api
        # The one upload limit, shown in the upload card. The backend and the engine take the same MAX_UPLOAD_MB.
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in the env file}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY in the env file}
    environment:
      NODE_ENV: production
      # Server-side calls stay on the private network: the backend, and the engine through the /api/cad proxy.
      API_URL: http://backend:4000/v1/api
      CAD_ENGINE_URL: http://cad-engine:5055
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?set CAD_ENGINE_API_KEY in the env file}
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [edge, internal, db]
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G, pids: 512 }

  backend:
    <<: *hardened
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        core: ./core
    environment:
      NODE_ENV: production
      PORT: 4000
      # Which deployment this is (stage or prd); the backend refuses to boot in production without it.
      APP_ENV: ${APP_ENV:?set APP_ENV to stage or prd in the env file}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in the env file}
      SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY in the env file}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SECRET_KEY:?set SUPABASE_SECRET_KEY in the env file}
      # The browser's origin; production validation rejects localhost and *.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN (the public frontend URL) in the env file}
      # The only way to reach this container is the Cloudflare tunnel, so the client address comes from CF-Connecting-IP.
      TRUST_CLOUDFLARE_HEADERS: "true"
      # 50 MB is the Supabase free tier's cap on one stored object; set 100 here on a paid plan (frontend and engine follow).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # python: this backend analyses uploads with the Python cad-engine. rust: the cad-core service does, and this backend only creates the BOM items.
      CAD_CORE: ${CAD_CORE:-python}
      # python: cad-engine /nest. rust: the nester binary shipped in this image (falls back to python if it is unavailable).
      NESTING_ENGINE: ${NESTING_ENGINE:-python}
      # supabase (default) or postgrest: with `postgrest` the backend talks to the postgrest service below and signs its own tokens.
      DB_BACKEND: ${DB_BACKEND:-supabase}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-supabase}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      POSTGREST_URL: http://postgrest:3000
      DB_JWT_SECRET: ${DB_JWT_SECRET:-}
      CAD_ENGINE_URL: http://cad-engine:5055
      # Shared secret between the backend and the engine; the engine refuses protected routes in production without it.
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?set CAD_ENGINE_API_KEY in the env file}
      ECAD_ENGINE_URL: http://ecad-engine:5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?set ECAD_ENGINE_API_KEY in the env file}
      # Telemetry is off while OTEL_EXPORTER_OTLP_ENDPOINT is empty (docs/ops/observability.md, docs/ops/monitoring.md). Metrics go to
      # Prometheus (docker-compose.monitoring.yml), e.g. http://prometheus:9090/api/v1/otlp/v1/metrics; traces to the OTLP backend
      # named by the endpoint. For metrics only, set the endpoint to http://prometheus:9090/api/v1/otlp and OTEL_TRACES_SAMPLER_ARG=0.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    volumes:
      - backend-logs:/app/logs
    tmpfs:
      - /tmp
    healthcheck:
      # Liveness only: a database or engine outage must not make Docker restart a healthy process.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [edge, internal]
    depends_on:
      cad-engine:
        condition: service_healthy
      ecad-engine:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G, pids: 512 }

  # --- Engines: private. They parse untrusted uploaded files, so they get no internet and no published port. ---
  cad-engine:
    <<: *hardened
    # pythonocc-core 7.7.2 is not published for linux/aarch64, so the image is amd64 everywhere (emulated on ARM dev machines).
    platform: linux/amd64
    build:
      context: ./cad-engine
      dockerfile: Dockerfile
    environment:
      PORT: 5055
      NODE_ENV: production
      PYTHONUNBUFFERED: 1
      TEMP_DIR: /tmp/cad-files
      TMPDIR: /tmp/cad-files
      CORS_ORIGINS: ${CORS_ORIGIN:?set CORS_ORIGIN in the env file}
      MAX_FILE_SIZE_MB: ${MAX_UPLOAD_MB:-50}
      RATE_LIMIT_PER_MINUTE: 10
      # Heavy requests at once. Measured peak memory is ~16 MB of RAM per MB of STEP (a 50 MB, 150-part assembly peaks at
      # ~800 MB), so a 100 MB assembly can need ~1.6 GB alone: raise this only together with the memory limit below.
      MAX_CONCURRENT_ANALYSES: 1
      # A request running longer than this ends the process so the restart policy replaces it (0 = off).
      ANALYSIS_HARD_LIMIT_SECONDS: 900
      CAD_ENGINE_API_KEY: ${CAD_ENGINE_API_KEY:?set CAD_ENGINE_API_KEY in the env file}
      LINEAR_DEFLECTION: 0.1
      ANGULAR_DEFLECTION: 0.5
      LOG_LEVEL: info
      # Telemetry is off while OTEL_EXPORTER_OTLP_ENDPOINT is empty (docs/ops/observability.md, docs/ops/monitoring.md). Metrics go to
      # Prometheus (docker-compose.monitoring.yml), e.g. http://prometheus:9090/api/v1/otlp/v1/metrics; traces to the OTLP backend
      # named by the endpoint. For metrics only, set the endpoint to http://prometheus:9090/api/v1/otlp and OTEL_TRACES_SAMPLER_ARG=0.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    volumes:
      - cad-temp:/tmp/cad-files
      - cad-logs:/app/logs
    tmpfs:
      - /tmp
      - /home/cad:uid=10002,gid=10002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G, pids: 512 }
        reservations: { cpus: '0.5', memory: 512M }

  # --- Assembly core: claims queued CAD uploads and analyses them with the C++ geometry worker (docs/ASSEMBLY_CORE.md). It talks to Supabase
  # over HTTPS only (no Postgres connection) and parses untrusted files in a child process that runs with an empty environment under
  # prlimit and a deadline. Runs only when CAD_CORE=rust (`docker compose --profile rust-core up`); with CAD_CORE=python the backend does it itself. ---
  cad-core:
    <<: *hardened
    profiles: [rust-core]
    platform: linux/amd64
    build:
      context: ./core
      dockerfile: Dockerfile
      additional_contexts:
        geometry: ./geometry-worker
        fixtures: ./backend/test/fixtures/cad
    environment:
      # Same switch as the backend: DB_BACKEND=postgrest needs POSTGREST_URL, DB_JWT_SECRET and S3_*; otherwise Supabase (the runner
      # refuses to start, naming the missing setting, when the ones its mode needs are empty).
      DB_BACKEND: ${DB_BACKEND:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      POSTGREST_URL: http://postgrest:3000
      DB_JWT_SECRET: ${DB_JWT_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      WORKER_DEADLINE_SECONDS: 600
      # The container limit below is 2 GB; the worker's own address-space limit stays under it (~16 MB of RAM per MB of STEP).
      WORKER_MEMORY_MB: 1536
    healthcheck:
      # No HTTP port: the runner rewrites a heartbeat file every 10 s from its own task, and `health` checks that it is recent.
      test: ["CMD", "cad-runner", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    tmpfs:
      - /tmp:size=1g
    networks: [edge, db]
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G, pids: 256 }
        reservations: { cpus: '0.5', memory: 256M }

  # --- PostgREST: the data API in front of the managed Postgres (docs: docs/ENGINEERING.md "Leaving Supabase"). Runs only with
  # `--profile postgrest` (DB_BACKEND=postgrest). Reachable ONLY from the backend: it is on the private `db` network with it and nothing
  # else, never published, and it accepts only tokens the backend signs with DB_JWT_SECRET. It needs outbound access to the database,
  # which is why it is not on the no-internet `internal` network. Connects as the `authenticator` role, which can only switch to
  # anon/authenticated/service_role. ---
  postgrest:
    <<: *hardened
    profiles: [postgrest]
    image: postgrest/postgrest@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    platform: linux/amd64
    user: "10004:10004"
    environment:
      # No `:?` here: Compose checks it for every service, even one in an inactive profile, and would stop the default stack. Empty means
      # PostgREST refuses to start (no database), and an empty secret means it rejects every token: both fail closed.
      PGRST_DB_URI: ${POSTGREST_DB_URI:-}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${DB_JWT_SECRET:-}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_POOL: 10
      # A transaction-mode pooler (Neon's, PgBouncer) cannot hold prepared statements; harmless with a direct connection.
      PGRST_DB_PREPARED_STATEMENTS: ${PGRST_DB_PREPARED_STATEMENTS:-false}
      PGRST_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [db]
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M, pids: 128 }

  ecad-engine:
    <<: *hardened
    build:
      context: ./ecad-engine
      dockerfile: Dockerfile
    environment:
      PORT: 5100
      ECAD_ENGINE_API_KEY: ${ECAD_ENGINE_API_KEY:?set ECAD_ENGINE_API_KEY in the env file}
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G, pids: 512 }

volumes:
  cad-temp:
  cad-logs:
  backend-logs:

networks:
  # The backend and PostgREST only: PostgREST needs a route out to the database, so it cannot live on `internal`, and it must not share
  # `edge` with the tunnel and the frontend.
  db: {}
  # Has a route to the internet (the tunnel dials out; the backend and frontend call Supabase).
  edge: {}
  # No route out and none in: engines can neither phone home nor be reached from outside.
  internal:
    internal: true
